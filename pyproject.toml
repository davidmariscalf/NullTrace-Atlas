[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nulltrace-atlas"
version = "0.1.0"
description = "Explainable negative-evidence cartography for sparse spatiotemporal observations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
dependencies = []

[project.scripts]
nulltrace = "nulltrace_atlas.cli:main"

[tool.setuptools.packages.find]
include = ["nulltrace_atlas*"]
