[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nulltrace-atlas"
version = "1.0.0"
description = "Explainable negative-evidence cartography for sparse spatiotemporal observations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
keywords = ["missing-data", "spatiotemporal", "anomaly-detection", "geojson", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
nulltrace = "nulltrace_atlas.cli:main"

[project.urls]
Repository = "https://github.com/davidmariscalf/NullTrace-Atlas"
Issues = "https://github.com/davidmariscalf/NullTrace-Atlas/issues"

[tool.setuptools.packages.find]
include = ["nulltrace_atlas*"]
