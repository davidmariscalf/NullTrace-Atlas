name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q nulltrace_atlas
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise CSV scan
        run: >-
          nulltrace scan examples/demo.csv
          --cadence 3600
          --threshold 0.70
          --json /tmp/traces.json
          --geojson /tmp/traces.geojson
          --slots-json /tmp/slots.json
          --analysis-json /tmp/analysis.json
          --quiet
      - name: Exercise inferred cadence on jittered JSONL
        run: >-
          nulltrace scan examples/jittered.jsonl
          --threshold 0.70
          --analysis-json /tmp/jitter-analysis.json
          --quiet
      - name: Exercise profile command
        run: nulltrace profile examples/demo.csv --json /tmp/profiles.json
